  <line x1="12" y1="21.5" x2="20" y2="21.5" stroke="#B08D57" stroke-width="1" stroke-linecap="round"/>
  <line x1="12" y1="23.5" x2="18" y2="23.5" stroke="#102A43" stroke-width="1" stroke-linecap="round"/>
</svg>
