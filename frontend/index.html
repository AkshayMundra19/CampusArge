<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102A43" />
    <title>CampusArge | Global Education, Real Opportunities</title>
    <meta name="description" content="Discover top universities, academic programs, scholarships and expert faculty across the globe. CampusArge connects students with world-class institutions and real opportunities." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://campusarge.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="CampusArge" />
    <meta property="og:url" content="https://campusarge.com/" />
    <meta property="og:title" content="CampusArge | Global Education, Real Opportunities" />
    <meta property="og:description" content="Discover top universities, academic programs, scholarships and expert faculty across the globe. Compare 426+ institutions with real tuition, acceptance rates, and campus data." />
    <meta property="og:image" content="https://campusarge.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CampusArge - Global Education for a Brighter Tomorrow" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@campusarge" />
    <meta name="twitter:creator" content="@campusarge" />
    <meta name="twitter:title" content="CampusArge | Global Education, Real Opportunities" />
    <meta name="twitter:description" content="Discover top universities, academic programs, scholarships and expert faculty across the globe. Compare 426+ institutions." />
    <meta name="twitter:image" content="https://campusarge.com/og-image.png" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "EducationalOrganization",
          "@id": "https://campusarge.com/#organization",
          "name": "CampusArge",
          "url": "https://campusarge.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://campusarge.com/favicon.svg",
            "width": 512,
            "height": 512
          },
          "description": "Global directory and comparison platform connecting verified academic institutions, degree programs, and students worldwide.",
          "email": "info@campusarge.com",
          "sameAs": [
            "https://www.linkedin.com/company/144138973/",
            "https://www.instagram.com/campusarge/",
            "https://x.com/campusarge",
            "https://www.youtube.com/@campusarge"
          ],
          "contactPoint": [
            {
              "@type": "ContactPoint",
              "email": "info@campusarge.com",
              "contactType": "general inquiries",
              "availableLanguage": ["English", "Hindi"]
            },
            {
              "@type": "ContactPoint",
              "email": "query@campusarge.com",
              "contactType": "admissions and queries",
              "availableLanguage": ["English", "Hindi"]
            }
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://campusarge.com/#website",
          "url": "https://campusarge.com",
          "name": "CampusArge",
          "publisher": {
            "@id": "https://campusarge.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://campusarge.com/institutions?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />

    <!-- Fonts: preconnect then load only needed weights -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
